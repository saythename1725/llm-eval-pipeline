
name: LLM Evaluation Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ollama chromadb langchain-text-splitters

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags; then
              break
            fi
            sleep 2
          done

      - name: Download local models
        run: |
          ollama pull qwen2.5:3b
          ollama pull nomic-embed-text

      - name: Build vector database
        working-directory: src
        run: python vector_store.py

      - name: Run evaluation
        working-directory: src
        run: python evaluate.py

      - name: Check regressions
        working-directory: src
        run: python regression_checker.py