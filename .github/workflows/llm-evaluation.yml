
name: LLM Evaluation Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ollama chromadb langchain-text-splitters

      # 4. Install Ollama
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # 5. Start Ollama server
      - name: Start Ollama server
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags; then
              break
            fi
            sleep 2
          done

      # 6. Download models
      - name: Download local models
        run: |
          ollama pull qwen2.5:3b
          ollama pull nomic-embed-text

      # 7. Build vector database
      - name: Build vector database
        working-directory: src
        run: python vector_store.py

      # 8. Run evaluation
      - name: Run evaluation
        working-directory: src
        run: python evaluate.py

      # 9. Generate HTML report
      - name: Generate HTML report
        working-directory: src
        run: python generate_html_report.py

      # 10. Check regressions
      - name: Check regressions
        working-directory: src
        run: python regression_checker.py

      # 11. Upload evaluation report
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-report
          path: reports/evaluation_report.html
          if-no-files-found: warn
